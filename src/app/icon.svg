<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The E-VOLVE "E", whose three arms double as leaderboard bars.

    The full wordmark is 1686x406 and turns to mush at 16px, so the mark is
    rebuilt from the letter alone. Arms ascend left-to-right rather than sitting
    flush, so it reads as a ranking as well as a letter. Gradient is the
    logo's own teal-to-orange.
  -->
  <defs>
    <linearGradient id="evolve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12B5CB" />
      <stop offset="0.55" stop-color="#5FD3E0" />
      <stop offset="1" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0F1720" />

  <g fill="url(#evolve)">
    <!-- Spine -->
    <rect x="14" y="14" width="9" height="36" rx="4.5" />
    <!-- Arms, ascending in length top to bottom -->
    <rect x="14" y="14" width="26" height="9" rx="4.5" />
    <rect x="14" y="27.5" width="21" height="9" rx="4.5" />
    <rect x="14" y="41" width="32" height="9" rx="4.5" />
  </g>
</svg>
